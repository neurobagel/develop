name: Test Python tool

on:
  workflow_call:
    inputs:
      tool:
        description: Folder name under tools/
        required: true
        type: string
      python-versions:
        description: JSON list of Python versions to test
        required: true
        type: string
      sync-args:
        description: Arguments for uv sync
        required: false
        type: string
        default: --group dev
      pytest-args:
        description: Arguments for pytest
        required: false
        type: string
        default: ""
      needs-graph:
        description: Start the tool's test graph with docker compose before testing
        required: false
        type: boolean
        default: false
      submodules:
        description: Check out git submodules
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        working-directory: tools/${{ inputs.tool }}

    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives versions from tags
          fetch-depth: 0
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Launch test graph
        if: inputs.needs-graph
        run: docker compose up -d test_graph export_datasets_metadata

      - name: Wait for graph setup
        if: inputs.needs-graph
        env:
          GRAPH_CONTAINER: ${{ inputs.tool }}-test_graph-1
        run: |
          timeout=120
          elapsed=0

          until docker logs "$GRAPH_CONTAINER" 2>&1 | grep -q "FINISHED UPLOADING DATA"; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Timed out waiting for graph setup"
              docker logs "$GRAPH_CONTAINER"
              exit 1
            fi

            sleep 1
            elapsed=$((elapsed + 1))
          done

      - name: Debug containers and test graph
        if: inputs.needs-graph
        env:
          GRAPH_CONTAINER: ${{ inputs.tool }}-test_graph-1
        run: |
          echo "=== All running and stopped containers ==="
          docker ps -a

          echo "=== Test graph logs ==="
          docker logs "$GRAPH_CONTAINER"

          echo "=== Test graph data directory contents ==="
          ls -l ./test_graph_data

      - name: Set up Python ${{ matrix.python-version }} with uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync-args }}
        run: eval "uv sync $SYNC_ARGS"

      # eval keeps quoted arguments such as -m "integration or not integration" intact
      - name: Test with pytest
        env:
          PYTEST_ARGS: ${{ inputs.pytest-args }}
        run: eval "uv run pytest $PYTEST_ARGS"
