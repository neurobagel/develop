name: PR title

# PRs are squash-merged with the PR title as the commit message, and
# release-please reads those messages: titles must follow Conventional Commits.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            api
            federation-api
            bagel-cli
            query-tool
            annotation-tool
            docs
            stack
            e2e
            migration
          requireScope: false
