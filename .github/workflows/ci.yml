name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color

      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      federation-api: ${{ steps.filter.outputs.federation-api }}
      api: ${{ steps.filter.outputs.api }}
      bagel-cli: ${{ steps.filter.outputs.bagel-cli }}
      query-tool: ${{ steps.filter.outputs.query-tool }}
      annotation-tool: ${{ steps.filter.outputs.annotation-tool }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed tools
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            federation-api:
              - 'tools/federation-api/**'
              - '.github/workflows/test-python.yml'
            api:
              - 'tools/api/**'
              - 'stack/**'
              - 'examples/**'
              - '.github/workflows/test-python.yml'
            bagel-cli:
              - 'tools/bagel-cli/**'
              - 'examples/**'
              - '.gitmodules'
              - '.github/workflows/test-python.yml'
            query-tool:
              - 'tools/query-tool/**'
              - 'examples/**'
              - '.github/workflows/test-node.yml'
              - '.github/actions/docker-build/**'
            annotation-tool:
              - 'tools/annotation-tool/**'
              - '.github/workflows/test-node.yml'

  check-unchanged:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # needs the imported upstream commits for the diff
          fetch-depth: 0

      - name: Check protected paths
        run: scripts/check-unchanged.sh

  federation-api:
    needs: changes
    if: needs.changes.outputs.federation-api == 'true'
    uses: ./.github/workflows/test-python.yml
    with:
      tool: federation-api
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/test-python.yml
    with:
      tool: api
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'
      pytest-args: -m "integration or not integration"
      needs-graph: true

  bagel-cli:
    needs: changes
    if: needs.changes.outputs.bagel-cli == 'true'
    uses: ./.github/workflows/test-python.yml
    with:
      tool: bagel-cli
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      sync-args: --group dev --upgrade
      pytest-args: -m "integration or not integration"
      submodules: true

  query-tool:
    needs: changes
    if: needs.changes.outputs.query-tool == 'true'
    uses: ./.github/workflows/test-node.yml
    with:
      tool: query-tool
      run-component: true
      run-e2e: true
      component-env: NB_API_QUERY_URL=https://federate.neurobagel.org/
      e2e-env: |
        NB_API_QUERY_URL=https://federate.neurobagel.org/
        NB_ENABLE_AUTH=true
        NB_QUERY_CLIENT_ID=mockclientid

  query-tool-image:
    needs: changes
    if: needs.changes.outputs.query-tool == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        uses: ./.github/actions/docker-build
        with:
          tool: query-tool
          tags: neurobagel/query_tool:ci
          load: "true"

      - name: Check that the image serves the app
        run: |
          # entrypoint.sh exits unless NB_API_QUERY_URL is set
          docker run -d --name query-tool -p 5173:5173 \
            -e NB_API_QUERY_URL=https://federate.neurobagel.org/ neurobagel/query_tool:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ || true)
            if [ "$code" = "200" ]; then
              echo "query-tool serves HTTP 200 on port 5173"
              exit 0
            fi
            sleep 1
          done
          echo "query-tool did not serve HTTP 200 on port 5173 (last: $code)"
          docker logs query-tool
          exit 1

  annotation-tool:
    needs: changes
    if: needs.changes.outputs.annotation-tool == 'true'
    uses: ./.github/workflows/test-node.yml
    with:
      tool: annotation-tool
      run-unit: true
      run-component: true
      run-e2e: true
      e2e-env: NB_DISABLE_CONFIG=false
      link-check: true
