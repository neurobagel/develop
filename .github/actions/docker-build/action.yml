name: Docker build
description: >
  Build a tool's Docker image with the repository root as build context and
  tools/<tool>/Dockerfile as the Dockerfile. Each Dockerfile has an allowlist
  ignore file next to it (tools/<tool>/Dockerfile.dockerignore), which BuildKit
  reads automatically.

inputs:
  tool:
    description: Folder name under tools/
    required: true
  tags:
    description: Image tags, one per line
    required: true
  push:
    description: Push the image
    required: false
    default: "false"
  load:
    description: Load the image into the local Docker daemon
    required: false
    default: "false"
  platforms:
    description: Target platforms
    required: false
    default: linux/amd64

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: tools/${{ inputs.tool }}/Dockerfile
        tags: ${{ inputs.tags }}
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        platforms: ${{ inputs.platforms }}
