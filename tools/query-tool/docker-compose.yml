services:
  init_data:
    extends:
      file: ../../stack/docker-compose.yml
      service: init_data
    profiles:
      - 'test'
    volumes:
      - '../../examples/data-upload/pheno-bids-derivatives-output:/input_data'
      - 'neurobagel_data:/data'

  api:
    extends:
      file: ../../stack/docker-compose.yml
      service: api
    profiles:
      - 'test'
    environment:
      NB_GRAPH_USERNAME: 'DBUSER'
      NB_RETURN_AGG: false
    volumes:
      - '../../stack/scripts/api_entrypoint.sh:/usr/src/api_entrypoint.sh'
    entrypoint:
      - '/usr/src/api_entrypoint.sh'
    secrets:
      - db_user_password

  graph:
    extends:
      file: ../../stack/docker-compose.yml
      service: graph
    profiles:
      - 'test'
    volumes:
      - 'graphdb_home:/opt/graphdb/home'
      - '../../stack/scripts:/usr/src/neurobagel/scripts'
      - '../../stack/vocab:/usr/src/neurobagel/vocab'
      - '../../examples/data-upload/pheno-bids-derivatives-output:/data'
    environment:
      NB_GRAPH_USERNAME: 'DBUSER'
    secrets:
      - db_admin_password
      - db_user_password

  federation:
    extends:
      file: ../../stack/docker-compose.yml
      service: federation
    profiles:
      - 'test'
    volumes:
      # The committed template defines the test profile's own api service as the local node
      - '../../stack/local_nb_nodes.template.json:/usr/src/local_nb_nodes.json:ro'

secrets:
  db_admin_password:
    file: ../../stack/secrets/NB_GRAPH_ADMIN_PASSWORD.txt
  db_user_password:
    file: ../../stack/secrets/NB_GRAPH_PASSWORD.txt

volumes:
  graphdb_home:
  neurobagel_data:
